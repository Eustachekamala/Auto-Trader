services:
  db:
    container_name: "auto-trader-postgres"
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: eustache
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auto_trader_db
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5434:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
    
volumes:
  db: