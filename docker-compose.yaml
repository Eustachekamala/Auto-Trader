services:
  db:
    container_name: "auto-trader-postgres"
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'auto_trader_db'
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres

    networks:
      - db
    restart: unless-stopped

    ports:
      - '5434:5432'
networks:
  db:
    driver: bridge
volumes:
  db: